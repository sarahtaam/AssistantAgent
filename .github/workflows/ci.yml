name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Seed demo database
        run: python seed.py

      - name: Train ML model
        run: python recouvrement/train.py

      # RAG is an optional extra (torch ~2GB). CI validates the core agent,
      # which is designed to run fully without it.

      - name: Run guardrail eval
        run: PYTHONPATH=. python scripts/eval_guardrails.py

      - name: Run tests
        run: pytest tests/ -v
